<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150" role="img" aria-label="CIRCA — AI care companion for pregnancy">
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
