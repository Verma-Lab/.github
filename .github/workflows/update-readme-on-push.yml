name: Update README on Push

# Manual-only: the auto-run on every push regenerated profile/README.md from
# update_readme.py's template ("Project 1 / Project 2" + commit tables) and
# would overwrite the hand-written org profile page. Run manually if the
# generated version is ever wanted again.
on:
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch repository data and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_readme.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile/README.md
          git commit -m 'Update README with latest changes'
          git push
